<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="BankingPoint24">
  <defs>
    <!-- Globe gradient (blue→teal) -->
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B5FA0"/>
      <stop offset="100%" stop-color="#2A9D8F"/>
    </linearGradient>
    <!-- Leaf swoosh gradient (teal→green) -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#5EAD3B"/>
    </linearGradient>
    <!-- Outer swoosh gradient -->
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EAD3B"/>
      <stop offset="100%" stop-color="#8BC34A"/>
    </linearGradient>
  </defs>

  <!-- Globe sphere -->
  <circle cx="26" cy="32" r="22" fill="url(#globe)"/>

  <!-- White inner swoosh (wave across the globe) -->
  <path d="M8,36 Q18,24 32,28 Q42,30 48,22" stroke="rgba(255,255,255,0.5)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M10,42 Q20,32 34,34 Q44,36 48,30" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Upper green swoosh/leaf -->
  <path d="M36,12 Q48,10 56,18 Q52,14 42,14 Q36,15 32,20" fill="url(#leaf)" opacity="0.9"/>

  <!-- Lower green swoosh/leaf -->
  <path d="M38,40 Q50,38 58,46 Q54,42 44,42 Q38,43 34,48" fill="url(#swoosh)" opacity="0.85"/>
</svg>
