# ══════════════════════════════════════════════════════════════════
#  BankingPoint24 — White-label PARTNER DOMAINS catch-all (:443)
# ══════════════════════════════════════════════════════════════════
#  Partner custom domains (e.g. masterindia.online) are proxied by
#  Cloudflare (orange cloud, Full SSL) and reach this EC2 box on :443.
#
#  This is the DEFAULT server for :443 — it accepts ANY hostname nginx
#  doesn't match by name, and forwards the real client Host header
#  (`$host`) to Next.js. The Next.js middleware then resolves the brand
#  from WhitelabelProfile.customDomain and renders the partner's page.
#
#  Without `proxy_set_header Host $host;` Next.js receives "localhost"
#  and serves the native BankingPoint24 page instead of the partner's.
#
#  bankingpoint-24.com itself is UNAFFECTED: it is served via CloudFront
#  → this EC2 on :80 (see nginx-bankingpoint24.conf), never :443.
#
#  Install:
#    sudo cp deploy/nginx-partner-domains.conf /etc/nginx/sites-available/partner-domains
#    sudo ln -sf /etc/nginx/sites-available/partner-domains /etc/nginx/sites-enabled/partner-domains
#    # ensure no OTHER :443 block is marked default_server (avoids a conflict):
#    sudo sed -i 's/ default_server//g' /etc/nginx/sites-available/BankingPoint24
#    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Reuse the platform's Let's Encrypt cert. Cloudflare is the public TLS
    # endpoint for the partner domain, so the cert CN does not need to match.
    ssl_certificate     /etc/letsencrypt/live/bankingpoint-24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bankingpoint-24.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # CRITICAL: forward the partner's real host so the tenant resolves.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
