# BankingPoint24 — nginx origin for CloudFront.
# bankingpoint-24.com DNS -> CloudFront (TLS terminated at the edge). CloudFront's
# origin is this EC2 box, which serves plain HTTP on :80 and proxies to the
# Next.js app on 127.0.0.1:3000. TRUSTED_PROXY_HOPS=2 in .env accounts for the
# CloudFront + nginx hops when deriving the real client IP.
#
# Install:
#   sudo cp deploy/nginx-bankingpoint24.conf /etc/nginx/sites-available/BankingPoint24
#   sudo ln -sf /etc/nginx/sites-available/BankingPoint24 /etc/nginx/sites-enabled/BankingPoint24
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bankingpoint-24.com www.bankingpoint-24.com _;

    # Security headers (CloudFront may add its own; these are origin-side).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # KYC document uploads.
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Next.js static assets — long immutable cache.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check (no access log noise).
    location /api/healthz {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ══════════════════════════════════════════════════════════════════
#  WHITE-LABEL PARTNER DOMAINS (e.g. masterindia.online)
# ══════════════════════════════════════════════════════════════════
#  Partner custom domains are proxied by Cloudflare (orange cloud, Full SSL)
#  and hit THIS EC2 on :443. This catch-all default_server accepts any host
#  nginx doesn't otherwise match and — crucially — forwards the real client
#  Host header (`$host`) to Next.js so the middleware can resolve the tenant
#  brand from WhitelabelProfile.customDomain.
#
#  The TLS cert is reused from the platform's Let's Encrypt cert. Cloudflare
#  (Full, non-strict) accepts it regardless of CN, since Cloudflare is the
#  public TLS endpoint for the partner domain.
#
#  Install (one step on the EC2):
#    sudo cp deploy/nginx-partner-domains.conf /etc/nginx/sites-available/partner-domains
#    sudo ln -sf /etc/nginx/sites-available/partner-domains /etc/nginx/sites-enabled/partner-domains
#    sudo nginx -t && sudo systemctl reload nginx
#
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Reuse the platform's Let's Encrypt cert (Cloudflare terminates TLS publicly).
    ssl_certificate     /etc/letsencrypt/live/bankingpoint-24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bankingpoint-24.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # CRITICAL: forward the partner's real host so the tenant resolves.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
